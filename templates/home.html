<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>saving</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-5 shadow-sm p-3">
            <form action="" method="post">
                {% csrf_token %}
                <div class="mb-3 mt-3">
                    <label for="names" class="form-label">names:</label>
                    <input type="text" class=" form-control" id="names" placeholder=" enter names" name="name">
                </div>

                <div class="mb-3 mt-3">
                    <label for="phone" class="form-label">phone:</label>
                    <input type="tel" class="form-control" id="pnone" placeholder="Enter phone number" name="phone">
                </div>

                <div class="mb-3 mt-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
                </div>
                <div class="mb-3">
                    <label for="pwd" class="form-label">Password:</label>
                    <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="password">
                </div>
                <div class="mb-3">
                    <label for="weight" class="form-label">weight:</label>
                    <input type="number" class="form-control" id="weight" placeholder="Enter weight" name="weight">
                </div>
                <div class="mb-3">
                    <label for="height" class="form-label">height:</label>
                    <input type="number" class="form-control" id="height" placeholder="Enter height" name="height">
                </div>
                <div class="mb-3">
                    <label class="form-check-input" for="male"></label>
                    <input type="radio" class="form-check-input-control" id="male" name="gender" value="male">male
                </div>
                <div class="mb-3">
                    <label class="form-check-input" for="female"></label>
                    <input type="radio" class="form-check-input-control" id="female" name="gender" value="female">female
                </div>
                {#                <div class="form-check mb-3">#}
                {#                    <label class="form-check-label">#}
                {#                        <input class="form-check-input" type="checkbox" name="remember"> Remember me#}
                {#                    </label>#}
                {#                </div>#}
                <button type="submit" class="btn btn-success w-100">Submit</button>
            </form>

        </div>
    </div>
</div>
</body>
</html>
